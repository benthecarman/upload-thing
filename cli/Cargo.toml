[package]
name = "upload-thing"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json", "charset", "http2"] }
regex = "1"
serde_json = "1"
