<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Projects by Ben Carman, ranked by recent GitHub activity.">
    <meta name="color-scheme" content="dark">
    <title>Ben Carman</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, "Cascadia Code", "Source Code Pro", monospace;
        background: #0b0d10;
        color: #f2f4f7;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        padding: clamp(2rem, 7vw, 5rem) 1.25rem;
      }
      main { width: min(52rem, 100%); margin: 0 auto; }
      header { margin-bottom: 3rem; }
      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2.5rem, 9vw, 5rem);
        line-height: 0.95;
        letter-spacing: -0.07em;
      }
      header p { margin: 0; color: #89929f; }
      a { color: inherit; }
      #projects { display: grid; gap: 0.75rem; }
      .project {
        display: block;
        padding: 1.25rem;
        border: 1px solid #2a3038;
        border-radius: 0.75rem;
        background: #11151a;
        color: inherit;
        text-decoration: none;
        transition: border-color 120ms ease, transform 120ms ease;
      }
      .project:hover, .project:focus-visible {
        border-color: #7dd3fc;
        transform: translateY(-2px);
        outline: none;
      }
      .project h2 { margin: 0; font-size: 1.1rem; color: #7dd3fc; }
      .project p { margin: 0.65rem 0 0; color: #c1c7d0; line-height: 1.5; }
      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1rem;
        margin-top: 0.85rem;
        color: #89929f;
        font-size: 0.8rem;
      }
      .status { color: #89929f; }
      footer { margin-top: 2rem; color: #89929f; font-size: 0.85rem; }
      footer a { color: #7dd3fc; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Ben Carman</h1>
        <p>Things I work on, ranked by recent GitHub activity.</p>
      </header>
      <section id="projects" aria-live="polite">
        <p class="status">Loading projects from GitHub…</p>
      </section>
      <footer>
        <a href="https://github.com/benthecarman" rel="me">github.com/benthecarman</a>
      </footer>
    </main>
    <script>
      const projects = document.querySelector("#projects");
      const dateFormat = new Intl.DateTimeFormat("en", {
        year: "numeric",
        month: "short",
        day: "numeric",
      });
      const eventWeights = {
        PushEvent: 3,
        PullRequestEvent: 5,
        PullRequestReviewEvent: 3,
        PullRequestReviewCommentEvent: 2,
        IssuesEvent: 3,
        IssueCommentEvent: 2,
        CommitCommentEvent: 2,
        ReleaseEvent: 6,
        CreateEvent: 1,
      };
      const eventLabels = {
        PushEvent: "pushes",
        PullRequestEvent: "pull requests",
        PullRequestReviewEvent: "reviews",
        PullRequestReviewCommentEvent: "review comments",
        IssuesEvent: "issues",
        IssueCommentEvent: "issue comments",
        CommitCommentEvent: "commit comments",
        ReleaseEvent: "releases",
        CreateEvent: "creation",
      };

      function textElement(tag, className, text) {
        const element = document.createElement(tag);
        if (className) element.className = className;
        element.textContent = text;
        return element;
      }

      function renderProject(repo) {
        const link = document.createElement("a");
        link.className = "project";
        link.href = repo.html_url;

        const name = repo.owner?.login === "benthecarman" ? repo.name : repo.full_name;
        link.append(textElement("h2", "", name));
        if (repo.description) {
          link.append(textElement("p", "", repo.description));
        }

        const meta = document.createElement("div");
        meta.className = "meta";
        if (repo.language) {
          meta.append(textElement("span", "", repo.language));
        }
        if (repo.stargazers_count) {
          meta.append(textElement("span", "", `★ ${repo.stargazers_count}`));
        }
        if (repo.recentEventCount) {
          const kinds = [...repo.recentEventKinds]
            .map((type) => eventLabels[type])
            .join(", ");
          meta.append(
            textElement(
              "span",
              "",
              `${repo.recentEventCount} recent ${repo.recentEventCount === 1 ? "event" : "events"}: ${kinds}`,
            ),
          );
        }
        meta.append(
          textElement(
            "span",
            "",
            `Updated ${dateFormat.format(new Date(repo.pushed_at))}`,
          ),
        );
        link.append(meta);
        return link;
      }

      function recency(date, halfLifeDays = 21) {
        const age = Math.max(0, Date.now() - new Date(date).getTime());
        return Math.pow(0.5, age / (halfLifeDays * 24 * 60 * 60 * 1000));
      }

      function rankProjects(repos, events) {
        const eventsByRepo = new Map();
        const candidates = new Map(
          repos.map((repo) => [repo.full_name.toLowerCase(), repo]),
        );
        for (const event of events) {
          if (!eventWeights[event.type] || !event.repo?.name) continue;
          const key = event.repo.name.toLowerCase();
          const repoEvents = eventsByRepo.get(key) ?? [];
          repoEvents.push(event);
          eventsByRepo.set(key, repoEvents);

          if (!candidates.has(key)) {
            const richRepo = event.payload?.pull_request?.base?.repo;
            const [owner, name] = event.repo.name.split("/");
            candidates.set(key, {
              ...richRepo,
              name: richRepo?.name ?? name,
              full_name: richRepo?.full_name ?? event.repo.name,
              owner: richRepo?.owner ?? { login: owner },
              html_url: richRepo?.html_url ?? `https://github.com/${event.repo.name}`,
              description: richRepo?.description ?? null,
              language: richRepo?.language ?? null,
              stargazers_count: richRepo?.stargazers_count ?? 0,
              pushed_at: richRepo?.pushed_at ?? event.created_at,
              fork: richRepo?.fork ?? false,
              archived: richRepo?.archived ?? false,
            });
          }
        }

        return [...candidates.values()]
          .filter((repo) => !repo.fork && !repo.archived)
          .map((repo) => {
            const recentEvents = eventsByRepo.get(repo.full_name.toLowerCase()) ?? [];
            const eventScore = recentEvents.reduce((score, event) => {
              const pushSize = event.type === "PushEvent"
                ? Math.min(Math.max(event.payload?.size ?? 1, 1), 5)
                : 1;
              return score + eventWeights[event.type] * pushSize * recency(event.created_at);
            }, 0);

            return {
              ...repo,
              activityScore: eventScore + recency(repo.pushed_at),
              recentEventCount: recentEvents.length,
              recentEventKinds: new Set(recentEvents.map((event) => event.type)),
            };
          })
          .sort(
            (a, b) =>
              b.activityScore - a.activityScore ||
              new Date(b.pushed_at) - new Date(a.pushed_at),
          )
          .slice(0, 12);
      }

      async function loadProjects() {
        try {
          const options = { headers: { Accept: "application/vnd.github+json" } };
          const [reposResponse, eventsResponse] = await Promise.all([
            fetch(
              "https://api.github.com/users/benthecarman/repos?type=owner&sort=pushed&direction=desc&per_page=100",
              options,
            ),
            fetch(
              "https://api.github.com/users/benthecarman/events/public?per_page=100",
              options,
            ).catch(() => null),
          ]);
          if (!reposResponse.ok) {
            throw new Error(`GitHub returned ${reposResponse.status}`);
          }

          const repos = await reposResponse.json();
          const events = eventsResponse?.ok ? await eventsResponse.json() : [];
          const ranked = rankProjects(repos, events);
          projects.replaceChildren(...ranked.map(renderProject));
        } catch (error) {
          const status = textElement(
            "p",
            "status",
            "GitHub activity is temporarily unavailable. View all projects on GitHub.",
          );
          const link = document.createElement("a");
          link.href = "https://github.com/benthecarman?tab=repositories";
          link.textContent = "Open GitHub";
          projects.replaceChildren(status, link);
          console.error(error);
        }
      }

      loadProjects();
    </script>
  </body>
</html>
